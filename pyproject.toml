[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visual-servo-mujoco"
version = "0.1.0"
description = "A camera-driven reaching demo in a small MuJoCo tabletop scene"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.15,<4",
  "numpy>=1.26",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
visual-servo-demo = "visual_servo_mujoco.run:main"
visual-servo-benchmark = "visual_servo_mujoco.benchmark:main"
visual-servo-dynamic-benchmark = "visual_servo_mujoco.dynamic_benchmark:main"
visual-servo-prediction-benchmark = "visual_servo_mujoco.prediction_benchmark:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
