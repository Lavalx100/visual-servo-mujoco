<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
<rect width="100%" height="100%" fill="#0b1220"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#a9b6c8}.white{fill:#f3f6fb}.green{fill:#57d6a3}.red{fill:#ff7b72}.blue{fill:#58a6ff}.orange{fill:#ffb86c}</style>
<text x="32" y="42" font-size="25" font-weight="700" class="white">Fresh visual confirmation - independent seeded validation</text>
<text x="32" y="70" font-size="14" class="muted">60 matched target poses per approach condition | fixed side camera | two new frames at 8.4 s and 8.8 s</text>
<text x="32" y="94" font-size="12" class="muted">Frozen image rules: at least 35 px rise; at most 12 px drift and 12 deg marker rotation</text>
<rect x="30" y="116" width="550" height="380" rx="14" fill="#141e30" stroke="#2b3850"/>
<text x="52" y="150" font-size="19" font-weight="700" class="white">5 mm baseline</text>
<text x="52" y="178" font-size="13" class="muted">N=20 | truth positive 19 | truth negative 1</text>
<text x="52" y="214" font-size="14" font-weight="700" class="blue">Image-only classifier vs. two-frame physical truth</text>
<text x="52" y="244" font-size="13" class="muted">Confirmed</text>
<text x="230" y="244" font-size="13" class="green">TP 19</text>
<text x="330" y="244" font-size="13" class="red">False confirmation 1</text>
<text x="52" y="270" font-size="13" class="muted">Not confirmed</text>
<text x="230" y="270" font-size="13" class="green">TN 0</text>
<text x="330" y="270" font-size="13" class="orange">Missed confirmation 0</text>
<text x="52" y="296" font-size="13" class="muted">Abstained 0 | coverage 100.0% | resolved accuracy 0.95</text>
<text x="52" y="337" font-size="14" font-weight="700" class="blue">Physical outcomes, reported separately</text>
<text x="52" y="366" font-size="13" class="muted">Payload stable during 1.6 s hold</text>
<text x="358" y="366" font-size="14" class="green">19/20</text>
<text x="52" y="392" font-size="13" class="muted">Strict full-sequence physical success</text>
<text x="358" y="392" font-size="14" class="green">19/20</text>
<text x="52" y="434" font-size="11" class="muted">Vision reads images only. Physics truth is evaluation-only; two samples do not</text>
<text x="52" y="452" font-size="11" class="muted">prove continuous holding or collision safety over the full motion.</text>
<rect x="600" y="116" width="550" height="380" rx="14" fill="#141e30" stroke="#2b3850"/>
<text x="622" y="150" font-size="19" font-weight="700" class="white">20 mm experimental approach</text>
<text x="622" y="178" font-size="13" class="muted">N=20 | truth positive 20 | truth negative 0</text>
<text x="622" y="214" font-size="14" font-weight="700" class="blue">Image-only classifier vs. two-frame physical truth</text>
<text x="622" y="244" font-size="13" class="muted">Confirmed</text>
<text x="800" y="244" font-size="13" class="green">TP 20</text>
<text x="900" y="244" font-size="13" class="red">False confirmation 0</text>
<text x="622" y="270" font-size="13" class="muted">Not confirmed</text>
<text x="800" y="270" font-size="13" class="green">TN 0</text>
<text x="900" y="270" font-size="13" class="orange">Missed confirmation 0</text>
<text x="622" y="296" font-size="13" class="muted">Abstained 0 | coverage 100.0% | resolved accuracy 1.0</text>
<text x="622" y="337" font-size="14" font-weight="700" class="blue">Physical outcomes, reported separately</text>
<text x="622" y="366" font-size="13" class="muted">Payload stable during 1.6 s hold</text>
<text x="928" y="366" font-size="14" class="green">20/20</text>
<text x="622" y="392" font-size="13" class="muted">Strict full-sequence physical success</text>
<text x="928" y="392" font-size="14" class="green">20/20</text>
<text x="622" y="434" font-size="11" class="muted">Vision reads images only. Physics truth is evaluation-only; two samples do not</text>
<text x="622" y="452" font-size="11" class="muted">prove continuous holding or collision safety over the full motion.</text>
<text x="32" y="535" font-size="13" class="orange">This validates the image decision against a precise two-capture label. It is not real-camera, hardware, or full-trajectory verification.</text>
<text x="32" y="565" font-size="12" class="muted">Each point is a randomized MuJoCo pose. Same targets are replayed under both approach settings; metrics remain paired.</text>
</svg>
