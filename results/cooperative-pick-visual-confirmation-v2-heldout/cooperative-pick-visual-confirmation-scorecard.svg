<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
<rect width="100%" height="100%" fill="#0b1220"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#a9b6c8}.white{fill:#f3f6fb}.green{fill:#57d6a3}.red{fill:#ff7b72}.blue{fill:#58a6ff}.orange{fill:#ffb86c}</style>
<text x="32" y="42" font-size="25" font-weight="700" class="white">Fresh visual confirmation - independent seeded validation</text>
<text x="32" y="70" font-size="14" class="muted">60 matched target poses per approach condition | fixed side camera | two new frames at 8.4 s and 8.8 s</text>
<text x="32" y="94" font-size="12" class="muted">Frozen V2 rule: at least 50 px rise; at most 12 px drift and 12 deg marker rotation</text>
<rect x="30" y="116" width="550" height="380" rx="14" fill="#141e30" stroke="#2b3850"/>
<text x="52" y="150" font-size="19" font-weight="700" class="white">5 mm baseline</text>
<text x="52" y="178" font-size="13" class="muted">N=60 | truth positive 52 | truth negative 8</text>
<text x="52" y="214" font-size="14" font-weight="700" class="blue">Image-only classifier vs. two-frame physical truth</text>
<text x="52" y="231" font-size="9" class="muted">False confirms V0/V1/V2: 1/1/1 | positive recall: 100%/100%/100%</text>
<text x="52" y="258" font-size="13" class="muted">Confirmed</text>
<text x="230" y="258" font-size="13" class="green">TP 52</text>
<text x="330" y="258" font-size="13" class="red">False confirmation 1</text>
<text x="52" y="284" font-size="13" class="muted">Not confirmed</text>
<text x="230" y="284" font-size="13" class="green">TN 7</text>
<text x="330" y="284" font-size="13" class="orange">Missed confirmation 0</text>
<text x="52" y="310" font-size="13" class="muted">Abstained 0 | coverage 100.0% | accuracy 0.9833</text>
<text x="52" y="347" font-size="14" font-weight="700" class="blue">Physical outcomes, reported separately</text>
<text x="52" y="375" font-size="13" class="muted">Payload stable during 1.6 s hold</text>
<text x="358" y="375" font-size="14" class="green">52/60</text>
<text x="52" y="401" font-size="13" class="muted">Strict full-sequence physical success</text>
<text x="358" y="401" font-size="14" class="green">52/60</text>
<text x="52" y="434" font-size="11" class="muted">Vision reads images only. Physics truth is evaluation-only; two samples do not</text>
<text x="52" y="452" font-size="11" class="muted">prove continuous holding or collision safety over the full motion.</text>
<rect x="600" y="116" width="550" height="380" rx="14" fill="#141e30" stroke="#2b3850"/>
<text x="622" y="150" font-size="19" font-weight="700" class="white">20 mm experimental approach</text>
<text x="622" y="178" font-size="13" class="muted">N=60 | truth positive 60 | truth negative 0</text>
<text x="622" y="214" font-size="14" font-weight="700" class="blue">Image-only classifier vs. two-frame physical truth</text>
<text x="622" y="231" font-size="9" class="muted">False confirms V0/V1/V2: 0/0/0 | positive recall: 100%/100%/100%</text>
<text x="622" y="258" font-size="13" class="muted">Confirmed</text>
<text x="800" y="258" font-size="13" class="green">TP 60</text>
<text x="900" y="258" font-size="13" class="red">False confirmation 0</text>
<text x="622" y="284" font-size="13" class="muted">Not confirmed</text>
<text x="800" y="284" font-size="13" class="green">TN 0</text>
<text x="900" y="284" font-size="13" class="orange">Missed confirmation 0</text>
<text x="622" y="310" font-size="13" class="muted">Abstained 0 | coverage 100.0% | accuracy 1.0</text>
<text x="622" y="347" font-size="14" font-weight="700" class="blue">Physical outcomes, reported separately</text>
<text x="622" y="375" font-size="13" class="muted">Payload stable during 1.6 s hold</text>
<text x="928" y="375" font-size="14" class="green">59/60</text>
<text x="622" y="401" font-size="13" class="muted">Strict full-sequence physical success</text>
<text x="928" y="401" font-size="14" class="green">58/60</text>
<text x="622" y="434" font-size="11" class="muted">Vision reads images only. Physics truth is evaluation-only; two samples do not</text>
<text x="622" y="452" font-size="11" class="muted">prove continuous holding or collision safety over the full motion.</text>
<text x="32" y="535" font-size="13" class="orange">This validates the image decision against a precise two-capture label. It is not real-camera, hardware, or full-trajectory verification.</text>
<text x="32" y="565" font-size="12" class="muted">Each point is a randomized MuJoCo pose. Same targets are replayed under both approach settings; metrics remain paired.</text>
</svg>
